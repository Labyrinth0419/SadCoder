    d="M 373 137 L 258 253 V 405 L 461 609 H 637 L 662 634 V 687 L 618 732 H 296 L 281 746 L 282 833 L 295 846 H 662 L 771 736 V 553 L 623 405 H 414 L 373 364 V 296 L 418 251 H 730 L 745 237 V 152 L 730 137 Z"
  />

  <!-- The dark silhouette is the keyline; all turns are explicit mitered folds. -->
  <path
    fill="#252B2D"
    d="M 373 137 L 258 253 V 405 L 461 609 H 637 L 662 634 V 687 L 618 732 H 296 L 281 746 L 282 833 L 295 846 H 662 L 771 736 V 553 L 623 405 H 414 L 373 364 V 296 L 418 251 H 730 L 745 237 V 152 L 730 137 Z"
  />

