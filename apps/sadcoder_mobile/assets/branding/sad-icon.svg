  <title id="title">Sad app icon</title>
  <desc id="description">
    An angular coral and mint S with crisp folded corners and a restrained 8-bit treatment.
  </desc>

  <rect width="1024" height="1024" fill="#F4F6F2" />

  <!-- Offset pixel shadow, kept as a separate silhouette for small-size clarity. -->
